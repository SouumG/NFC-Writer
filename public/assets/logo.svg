<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Deep Dark Rounded Canvas Background -->
  <rect width="100" height="100" rx="20" fill="#030712"/>
  
  <!-- Glowing blue circles (Simulating NFC signal tracks) -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#3b82f6" stroke-width="4"/>

  <!-- Scanning indicator beam -->
  <line x1="50" y1="15" x2="50" y2="85" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Central Antennas Node Core -->
  <circle cx="50" cy="50" r="6" fill="#f3f4f6" />
</svg>
